<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>消息 - 校园社交</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .msg-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .msg-header h1 {
            font-size: 1.125rem;
            font-weight: 600;
            text-align: center;
        }

        .msg-tabs {
            display: flex;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .msg-tab {
            flex: 1;
            padding: 0.875rem;
            text-align: center;
            font-size: 0.9375rem;
            color: var(--text-secondary);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .msg-tab.active {
            color: var(--primary-color);
            font-weight: 500;
        }

        .msg-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 2px;
            background: var(--primary-color);
        }

        .msg-content {
            padding-bottom: 5rem;
        }

        .msg-list {
            display: none;
        }

        .msg-list.active {
            display: block;
        }

        .msg-item {
            display: flex;
            align-items: center;
            padding: 0.875rem 1rem;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .msg-item:active {
            background: var(--bg-secondary);
        }

        .msg-item.unread .msg-avatar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0.625rem;
            height: 0.625rem;
            background: var(--danger-color);
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
        }

        .msg-avatar {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.125rem;
            font-weight: 600;
            position: relative;
            flex-shrink: 0;
        }

        .msg-info {
            flex: 1;
            margin-left: 0.875rem;
            min-width: 0;
        }

        .msg-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .msg-name {
            font-weight: 500;
            font-size: 0.9375rem;
        }

        .msg-time {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .msg-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .msg-preview {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .msg-unread {
            min-width: 1.125rem;
            height: 1.125rem;
            background: var(--danger-color);
            color: white;
            border-radius: 50%;
            font-size: 0.6875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 0.5rem;
            padding: 0 0.375rem;
        }

        .msg-type-badge {
            display: inline-block;
            padding: 0.125rem 0.375rem;
            border-radius: var(--radius-sm);
            font-size: 0.6875rem;
            margin-left: 0.5rem;
        }

        .msg-type-badge.study {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
        }

        .msg-type-badge.kaoyan {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
        }

        .msg-type-badge.friend {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .msg-type-badge.love {
            background: rgba(236, 72, 153, 0.1);
            color: var(--secondary-color);
        }

        .system-msg-item {
            background: var(--bg-primary);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .system-msg-title {
            font-weight: 500;
            font-size: 0.9375rem;
            margin-bottom: 0.375rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .system-msg-icon {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .system-msg-content {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-left: 2rem;
        }

        .system-msg-time {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-left: 2rem;
            margin-top: 0.25rem;
        }

        /* 新增：好友申请按钮样式 */
        .apply-btns {
            display: flex;
            gap: 0.5rem;
        }

        .apply-btn {
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .agree-btn {
            background: var(--primary-color);
            color: white;
        }

        .refuse-btn {
            background: #ccc;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="msg-header">
            <h1>消息</h1>
        </div>

        <div class="msg-tabs">
            <div class="msg-tab active" onclick="switchTab('chat')">
                我的好友
            </div>
            <div class="msg-tab" onclick="switchTab('system')">
                好友申请
            </div>
        </div>

        <div class="msg-content">
            <!-- 好友列表 -->
            <div class="msg-list active" id="chat-list">
                <div class="loading">加载中...</div>
            </div>

            <!-- 好友申请列表 -->
            <div class="msg-list" id="system-list">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <span>🏠</span>
                <span>首页</span>
            </a>
            <a href="match.html" class="nav-item">
                <span>🔍</span>
                <span>匹配</span>
            </a>
            <a href="messages.html" class="nav-item active">
                <span>💬</span>
                <span>消息</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span>👤</span>
                <span>我的</span>
            </a>
        </nav>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/utils.js"></script>
    <script>
        // 登录校验
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');
        // 🔥 修复1：改成你的虚拟机后端地址，不能用localhost
        const BASE_URL = 'http://39.108.165.213:8080';
        if (!token) {
            showToast('请先登录');
            setTimeout(() => {
                window.location.href = '../index.html';
            }, 1000);
        }

        let currentTab = 'chat';

        function init() {
            loadFriendList();    // 加载好友列表（完全不动，你原来的代码是能用的）
            loadInviteList();    // 加载好友申请（只改这里）
            setInterval(() => {
                loadFriendList();
                loadInviteList();
            }, 30000);
        }

        // 标签切换（完全不动）
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.msg-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.msg-list').forEach(l => l.classList.remove('active'));
            event.target.closest('.msg-tab').classList.add('active');
            document.getElementById(tab + '-list').classList.add('active');
        }

        // 1. 加载【我的好友】列表（完全不动，你原来的代码是能用的，只改了请求地址）
        async function loadFriendList() {
            try {
                const res = await fetch(`${BASE_URL}/api/chats`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const listEl = document.getElementById('chat-list');

                if (data.success && data.data.length) {
                    let html = '';
                    data.data.forEach(item => {
                        const name = item.name || '好友';
                        const friendId = item.userId || item.id;
                        // 新增：点击进入聊天，不影响原有功能
                        html += `
                        <div class="msg-item" onclick="goToChat('${friendId}', '${name}')">
                            <div class="msg-avatar">${name[0]}</div>
                            <div class="msg-info">
                                <div class="msg-top">
                                    <div class="msg-name">${name}</div>
                                </div>
                                <div class="msg-bottom">
                                    <div class="msg-preview">已成为好友</div>
                                </div>
                            </div>
                        </div>`;
                    });
                    listEl.innerHTML = html;
                } else {
                    listEl.innerHTML = '<div class="empty-state" style="text-align:center;padding:2rem;">暂无好友</div>';
                }
            } catch (e) {
                console.error('加载好友列表失败：', e);
                document.getElementById('chat-list').innerHTML = '<div class="empty-state" style="text-align:center;padding:2rem;">加载失败</div>';
            }
        }

        // 2. 加载【好友申请】列表 🔥 核心修复：接口地址改成后端正确的
        async function loadInviteList() {
            try {
                // 修复：接口地址从 /api/invites/list 改成 /api/invites/received，和后端匹配
                const res = await fetch(`${BASE_URL}/api/invites/received`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const listEl = document.getElementById('system-list');

                if (data.success && data.data.length) {
                    let html = '';
                    data.data.forEach(item => {
                        // 兼容后端返回的字段名
                        const inviteId = item.id || item.inviteId;
                        const fromName = item.fromName || item.fromUserName;
                        html += `
                        <div class="system-msg-item">
                            <div class="system-msg-title">
                                <div class="system-msg-icon">👤</div>
                                ${fromName} 请求添加你为好友
                            </div>
                            <div class="apply-btns" style="margin-left:2rem;margin-top:0.5rem;">
                                <button class="apply-btn agree-btn" onclick="handleInvite('${inviteId}','accept')">同意</button>
                                <button class="apply-btn refuse-btn" onclick="handleInvite('${inviteId}','reject')">拒绝</button>
                            </div>
                        </div>`;
                    });
                    listEl.innerHTML = html;
                } else {
                    listEl.innerHTML = '<div class="empty-state" style="text-align:center;padding:2rem;">暂无好友申请</div>';
                }
            } catch (e) {
                console.error('加载好友申请失败：', e);
                document.getElementById('system-list').innerHTML = '<div class="empty-state" style="text-align:center;padding:2rem;">加载失败</div>';
            }
        }

        // 3. 处理好友申请（同意/拒绝）🔥 修复：参数改成后端需要的 accept/reject
        async function handleInvite(inviteId, action) {
            try {
                const res = await fetch(`${BASE_URL}/api/invites/handle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    // 修复：action 传 accept/reject，和后端匹配
                    body: JSON.stringify({ inviteId: inviteId, action: action })
                });
                const data = await res.json();
                showToast(data.message);
                loadInviteList();
                loadFriendList();
            } catch (err) {
                console.error('处理申请失败：', err);
                showToast('操作失败');
            }
        }

        // 新增：点击好友进入聊天，不影响原有功能
        function goToChat(userId, name) {
            window.location.href = `chat.html?userId=${encodeURIComponent(userId)}&name=${encodeURIComponent(name)}`;
        }

        init();
    </script>
</body>

</html>
