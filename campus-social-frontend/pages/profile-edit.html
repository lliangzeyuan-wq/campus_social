<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>完善资料 - 校园社交</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
	.mobile-container{
	    padding-bottom:120px !important;
	}
	.bottom-nav{
            position:fixed;
	    bottom:0;
	    left:0;
	    right:0;
	    z-index:99;
	}
        .step-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }

        .step-dots {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .dot {
            width: 2rem;
            height: 0.25rem;
            border-radius: 0.125rem;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .dot.active {
            background: white;
        }

        .back-btn {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 2rem;
            height: 2rem;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .step-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            padding-bottom: 5rem;
            -webkit-overflow-scrolling: touch;
        }

        .step-page {
            display: none;
        }

        .step-page.active {
            display: block;
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .section-desc {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .form-item {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .gender-group {
            display: flex;
            gap: 1rem;
        }

        .gender-btn {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gender-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .tag-group {
            margin-bottom: 1.5rem;
        }

        .tag-category {
            font-weight: 500;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .tag-item {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .tag-item.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .step-footer {
            padding: 1rem;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            padding: 0.875rem;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }

        .btn-default {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="step-header">
            <button class="back-btn" onclick="goBack()">‹</button>
            <h1 style="font-size: 1.25rem; margin: 0;">完善个人资料</h1>
            <div class="step-dots">
                <div class="dot dot-1 active"></div>
                <div class="dot dot-2"></div>
                <div class="dot dot-3"></div>
            </div>
        </div>

        <div class="step-content">
            <div class="step-page step-1 active">
                <div class="section-title">基本信息</div>
                <div class="section-desc">让其他小伙伴更好地认识你</div>

                <div class="form-item">
                    <label class="form-label">姓名 *</label>
                    <input type="text" class="form-input" id="name" placeholder="请输入你的姓名">
                </div>

                <div class="form-item">
                    <label class="form-label">学院</label>
                    <input type="text" class="form-input" id="college" placeholder="请输入你的学院">
                </div>

                <div class="form-item">
                    <label class="form-label">专业 *</label>
                    <input type="text" class="form-input" id="major" placeholder="请输入你的专业">
                </div>

                <div class="form-item">
                    <label class="form-label">年级</label>
                    <select class="form-select" id="grade">
                        <option value="">请选择年级</option>
                        <option value="大一">大一</option>
                        <option value="大二">大二</option>
                        <option value="大三">大三</option>
                        <option value="大四">大四</option>
                        <option value="研究生">研究生</option>
                    </select>
                </div>

                <div class="form-item">
                    <label class="form-label">性别</label>
                    <div class="gender-group">
                        <button class="gender-btn" data-gender="male" id="genderMale">男</button>
                        <button class="gender-btn" data-gender="female" id="genderFemale">女</button>
                    </div>
                </div>
            </div>

            <div class="step-page step-2">
                <div class="section-title">学习偏好</div>
                <div class="section-desc">帮助我们为你匹配更合适的学习伙伴</div>

                <div class="form-item">
                    <label class="form-label">常去自习地点（可多选）</label>
                    <div class="tag-list">
                        <div class="tag-item" data-location="图书馆">图书馆</div>
                        <div class="tag-item" data-location="教学楼">教学楼</div>
                        <div class="tag-item" data-location="自习室">自习室</div>
                        <div class="tag-item" data-location="宿舍">宿舍</div>
                        <div class="tag-item" data-location="咖啡厅">咖啡厅</div>
                    </div>
                </div>

                <div class="form-item">
                    <label class="form-label">学习时间段</label>
                    <div class="tag-list">
                        <div class="tag-item" data-time="早晨6-9点">早晨6-9点</div>
                        <div class="tag-item" data-time="上午9-12点">上午9-12点</div>
                        <div class="tag-item" data-time="下午2-6点">下午2-6点</div>
                        <div class="tag-item" data-time="晚上7-11点">晚上7-11点</div>
                    </div>
                </div>

                <div class="form-item">
                    <label class="form-label">个人简介</label>
                    <textarea class="form-textarea" id="introduction" placeholder="介绍一下你自己吧~"></textarea>
                </div>
            </div>

            <div class="step-page step-3">
                <div class="section-title">兴趣标签</div>
                <div class="section-desc">选择你感兴趣的内容（可多选）</div>

                <div class="tag-group">
                    <div class="tag-category">
                        <span>🏃</span> 运动健身
                    </div>
                    <div class="tag-list">
                        <div class="tag-item" data-tag="跑步">跑步</div>
                        <div class="tag-item" data-tag="篮球">篮球</div>
                        <div class="tag-item" data-tag="羽毛球">羽毛球</div>
                        <div class="tag-item" data-tag="游泳">游泳</div>
                        <div class="tag-item" data-tag="健身">健身</div>
                        <div class="tag-item" data-tag="瑜伽">瑜伽</div>
                    </div>
                </div>

                <div class="tag-group">
                    <div class="tag-category">
                        <span>🎮</span> 娱乐游戏
                    </div>
                    <div class="tag-list">
                        <div class="tag-item" data-tag="王者荣耀">王者荣耀</div>
                        <div class="tag-item" data-tag="和平精英">和平精英</div>
                        <div class="tag-item" data-tag="原神">原神</div>
                        <div class="tag-item" data-tag="桌游">桌游</div>
                        <div class="tag-item" data-tag="剧本杀">剧本杀</div>
                        <div class="tag-item" data-tag="K歌">K歌</div>
                    </div>
                </div>

                <div class="tag-group">
                    <div class="tag-category">
                        <span>🎨</span> 文化艺术
                    </div>
                    <div class="tag-list">
                        <div class="tag-item" data-tag="阅读">阅读</div>
                        <div class="tag-item" data-tag="电影">电影</div>
                        <div class="tag-item" data-tag="音乐">音乐</div>
                        <div class="tag-item" data-tag="摄影">摄影</div>
                        <div class="tag-item" data-tag="绘画">绘画</div>
                        <div class="tag-item" data-tag="写作">写作</div>
                    </div>
                </div>

                <div class="tag-group">
                    <div class="tag-category">
                        <span>📚</span> 学习技能
                    </div>
                    <div class="tag-list">
                        <div class="tag-item" data-tag="编程">编程</div>
                        <div class="tag-item" data-tag="外语">外语</div>
                        <div class="tag-item" data-tag="乐器">乐器</div>
                        <div class="tag-item" data-tag="视频剪辑">视频剪辑</div>
                        <div class="tag-item" data-tag="设计">设计</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="step-footer">
            <button class="btn btn-default" id="prevBtn">上一步</button>
            <button class="btn btn-primary" id="nextBtn">下一步</button>
        </div>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <span>🏠</span>
                <span>首页</span>
            </a>
            <a href="match.html" class="nav-item">
                <span>🔍</span>
                <span>匹配</span>
            </a>
            <a href="messages.html" class="nav-item">
                <span>💬</span>
                <span>消息</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <span>👤</span>
                <span>我的</span>
            </a>
        </nav>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/utils.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');
        if (!token || !userId) {
            showToast('请先登录');
            setTimeout(() => {
                window.location.href = '../index.html';
            }, 1000);
        }

        let currentStep = 1;
        // 🔥 初始化formData时，给location赋初始空字符串，避免undefined
        let formData = {
            name: '',
            college: '',
            major: '',
            grade: '',
            gender: '',
            location: '',
            studyTime: '',
            introduction: '',
            interests: []
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserProfile();
            bindEvents();
            renderStep();
        });

        async function loadUserProfile() {
            try {
                const res = await fetch(`http://39.108.165.213:8080/api/profile/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                console.log("加载已有资料：", result);
                if (result.success && result.data) {
                    const data = result.data;
                    formData = {
                        name: data.name || '',
                        college: data.college || '',
                        major: data.major || '',
                        grade: data.grade || '',
                        gender: data.gender || '',
                        // 🔥 处理已有location，确保是字符串，避免undefined
                        location: data.location || '',
                        studyTime: data.studyTime || '',
                        introduction: data.introduction || '',
                        interests: data.interests ? data.interests.split(',') : []
                    };

                    document.getElementById('name').value = formData.name;
                    document.getElementById('college').value = formData.college;
                    document.getElementById('major').value = formData.major;
                    document.getElementById('grade').value = formData.grade;
                    document.getElementById('introduction').value = formData.introduction;

                    if (formData.gender === 'male') {
                        document.getElementById('genderMale').classList.add('active');
                    } else if (formData.gender === 'female') {
                        document.getElementById('genderFemale').classList.add('active');
                    }

                    // 🔥 回显常去地点（支持多选）
                    if (formData.location) {
                        const selectedLocations = formData.location.split(',').map(item => item.trim());
                        document.querySelectorAll('.step-2 .tag-item[data-location]').forEach(item => {
                            if (selectedLocations.includes(item.dataset.location)) {
                                item.classList.add('active');
                            }
                        });
                    }

                    if (formData.studyTime) {
                        document.querySelectorAll('.step-2 .tag-item[data-time]').forEach(item => {
                            if (item.dataset.time === formData.studyTime) {
                                item.classList.add('active');
                            }
                        });
                    }

                    if (formData.interests.length > 0) {
                        document.querySelectorAll('.step-3 .tag-item[data-tag]').forEach(item => {
                            if (formData.interests.includes(item.dataset.tag)) {
                                item.classList.add('active');
                            }
                        });
                    }
                }
            } catch (e) {
                console.error("加载用户资料失败：", e);
            }
        }

        function bindEvents() {
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    formData.gender = btn.dataset.gender;
                });
            });

            // 🔥 核心修复1：常去地点多选逻辑，100%确保赋值正确
            document.querySelectorAll('.step-2 .tag-item[data-location]').forEach(item => {
                item.addEventListener('click', () => {
                    item.classList.toggle('active');
                    // 🔥 每次点击都重新收集所有选中的地点，确保实时更新
                    const selectedLocations = Array.from(document.querySelectorAll('.step-2 .tag-item[data-location].active'))
                        .map(el => el.dataset.location.trim())
                        .filter(item => item); // 过滤空值
                    formData.location = selectedLocations.join(',');
                    console.log("当前选中的常去地点：", formData.location); // 🔍 日志：实时查看选中值
                });
            });

            // 学习时间单选
            document.querySelectorAll('.step-2 .tag-item[data-time]').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.step-2 .tag-item[data-time]').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    formData.studyTime = item.dataset.time;
                });
            });

            // 兴趣标签多选
            document.querySelectorAll('.step-3 .tag-item[data-tag]').forEach(item => {
                item.addEventListener('click', () => {
                    const tag = item.dataset.tag;
                    item.classList.toggle('active');
                    if (item.classList.contains('active')) {
                        if (!formData.interests.includes(tag)) {
                            formData.interests.push(tag);
                        }
                    } else {
                        formData.interests = formData.interests.filter(t => t !== tag);
                    }
                });
            });

            document.getElementById('prevBtn').addEventListener('click', () => {
                if (currentStep > 1) {
                    currentStep--;
                    renderStep();
                }
            });

            // 🔥 核心修复2：下一步/完成按钮，100%确保提交前同步最新数据
            document.getElementById('nextBtn').addEventListener('click', async () => {
                if (currentStep === 1) {
                    formData.name = document.getElementById('name').value.trim();
                    formData.college = document.getElementById('college').value.trim();
                    formData.major = document.getElementById('major').value.trim();
                    formData.grade = document.getElementById('grade').value;

                    if (!formData.name) {
                        showToast('请输入姓名');
                        return;
                    }
                    if (!formData.major) {
                        showToast('请输入专业');
                        return;
                    }
                    currentStep++;
                    renderStep();
                }
                else if (currentStep === 2) {
                    // 🔥 第二步切换时，同步最新的introduction，不提交，避免空值覆盖
                    formData.introduction = document.getElementById('introduction').value.trim();
                    currentStep++;
                    renderStep();
                }
                else if (currentStep === 3) {
                    if (formData.interests.length === 0) {
                        showToast('请至少选择一个兴趣标签');
                        return;
                    }
                    // 🔥 提交前，最后一次同步常去地点，确保是最新值
                    const finalSelectedLocations = Array.from(document.querySelectorAll('.step-2 .tag-item[data-location].active'))
                        .map(el => el.dataset.location.trim())
                        .filter(item => item);
                    formData.location = finalSelectedLocations.join(',');
                    console.log("最终提交的formData：", formData); // 🔍 日志：查看最终提交的所有数据

                    await submitProfile();
                    showToast('资料更新成功！');
                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 1000);
                }
            });
        }

        function renderStep() {
            document.querySelectorAll('.step-page').forEach(page => {
                page.classList.remove('active');
            });
            document.querySelector(`.step-${currentStep}`).classList.add('active');

            document.querySelectorAll('.dot').forEach((dot, index) => {
                dot.classList.toggle('active', index + 1 <= currentStep);
            });

            if (currentStep === 1) {
                document.getElementById('prevBtn').style.visibility = 'hidden';
                document.getElementById('nextBtn').textContent = '下一步';
            } else if (currentStep === 2) {
                document.getElementById('prevBtn').style.visibility = 'visible';
                document.getElementById('nextBtn').textContent = '下一步';
            } else if (currentStep === 3) {
                document.getElementById('prevBtn').style.visibility = 'visible';
                document.getElementById('nextBtn').textContent = '完成';
            }
        }

        async function submitProfile() {
            try {
                const res = await fetch('http://39.108.165.213:8080/api/profile/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });
                const result = await res.json();
                console.log("提交结果：", result); // 🔍 日志：查看后端返回的提交结果
                if (!result.success) {
                    throw new Error(result.message);
                }
            } catch (e) {
                console.error("资料提交失败：", e);
                showToast(e.message || '提交失败');
                throw e;
            }
        }

        function goBack() {
            if (currentStep > 1) {
                currentStep--;
                renderStep();
            } else {
                window.location.href = 'profile.html';
            }
        }
    </script>
</body>

</html>
